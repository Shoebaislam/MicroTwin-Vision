name: Python smoke test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Run toy-only end-to-end smoke test
        run: |
          python make_demo_data.py
          python run_experiment.py --data-dir demo_data --sample-size 100 --pore-is-white
      - name: Check example artifacts
        run: test -s results/metrics.csv && test -s results/mae_noise.png && test -s results/r2_noise.png
